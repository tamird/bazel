name: Scanner Bazel binaries

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of native platforms to build
        type: string
        default: '["linux-x86_64", "linux-arm64", "darwin-arm64", "darwin-x86_64"]'

permissions:
  contents: read

concurrency:
  group: scanner-bazel-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'tamird/bazel'
    name: ${{ matrix.platform }}
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-arm64":"macos-15","darwin-x86_64":"macos-15-intel"}')[matrix.platform] }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    env:
      SOURCE_COMMIT: bb0242a6768e0e160220bf0dc942fe11a6bfa826
      BAZEL_VERSION: 10.0.0-bb0242a676
      USE_BAZEL_VERSION: 9.3.1
      BINARY_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: bb0242a6768e0e160220bf0dc942fe11a6bfa826
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: scanner-bazel-native
          repository-cache: true
          bazelrc: startup --host_jvm_args=-Xmx8g

      - name: Record native build environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scanner-bazel"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          {
            uname -a
            df -h .
            if [[ "$RUNNER_OS" == macOS ]]; then
              sysctl hw.memsize
              xcodebuild -version
            else
              cat /proc/meminfo
            fi
            bazel --version
            cc --version
          } | tee "$RUNNER_TEMP/scanner-bazel/environment.log"

      - name: Build and test native Bazel
        # The step bound leaves an upload/cache opportunity within the job bound.
        timeout-minutes: 150
        shell: bash
        run: |
          flags=(-c opt --jobs=2 --local_test_jobs=1 --lockfile_mode=error
                 --stamp "--embed_label=$BAZEL_VERSION")
          # Canonical embedded-JDK release target and optimization mode from
          # .bazelci/build_bazel_binaries.yml; no cross compilation.
          bazel build "${flags[@]}" //src:bazel \
            --profile="$RUNNER_TEMP/scanner-bazel/build.profile.gz" \
            2>&1 | tee "$RUNNER_TEMP/scanner-bazel/build.log"
          bazel test "${flags[@]}" --test_output=errors --nocache_test_results \
            --profile="$RUNNER_TEMP/scanner-bazel/tests.profile.gz" \
            --build_event_json_file="$RUNNER_TEMP/scanner-bazel/tests.bep.json" \
            //src/test/java/com/google/devtools/build/lib/starlark:StarlarkMapActionTemplateTest \
            //src/test/java/com/google/devtools/build/lib/starlark:StarlarkActionTest \
            //src/test/java/com/google/devtools/build/lib/starlark:StarlarkActionWithShadowedActionTest \
            //src/test/java/com/google/devtools/build/lib/buildtool:AqueryBuildToolTest \
            //src/test/java/com/google/devtools/build/lib/sandbox:SmallTests \
            2>&1 | tee "$RUNNER_TEMP/scanner-bazel/tests.log"
          bazel test "${flags[@]}" --test_output=errors --nocache_test_results \
            --test_filter=actionRewinding_prunedRunfilesInput_recovers \
            --build_event_json_file="$RUNNER_TEMP/scanner-bazel/discovery-tests.bep.json" \
            //src/test/java/com/google/devtools/build/lib/remote:BuildWithoutTheBytesIntegrationTest \
            2>&1 | tee "$RUNNER_TEMP/scanner-bazel/discovery-tests.log"
          bazel test "${flags[@]}" --test_output=errors --nocache_test_results \
            --test_filter=RemoteRewoundActionSynchronizerTest \
            --build_event_json_file="$RUNNER_TEMP/scanner-bazel/lock-tests.bep.json" \
            //src/test/java/com/google/devtools/build/lib/remote:RemoteTests \
            2>&1 | tee "$RUNNER_TEMP/scanner-bazel/lock-tests.log"

      - name: Verify packaged native runtime and record artifact
        shell: bash
        run: |
          binary="$RUNNER_TEMP/scanner-bazel/bazel-$BAZEL_VERSION-$BINARY_PLATFORM"
          cp bazel-bin/src/bazel "$binary"
          chmod +x "$binary"
          # Start the packaged JVM only after the build and regression tests finish.
          "$binary" --batch --host_jvm_args=-Xmx8g version \
            2>&1 | tee "$RUNNER_TEMP/scanner-bazel/runtime.log"
          grep -Fx "Build label: $BAZEL_VERSION" "$RUNNER_TEMP/scanner-bazel/runtime.log"
          file "$binary" | tee "$RUNNER_TEMP/scanner-bazel/binary-format.log"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          directory = Path(os.environ["RUNNER_TEMP"]) / "scanner-bazel"
          version = os.environ["BAZEL_VERSION"]
          platform = os.environ["BINARY_PLATFORM"]
          binary = directory / f"bazel-{version}-{platform}"
          with binary.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          record = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "bootstrap_version": os.environ["USE_BAZEL_VERSION"],
              "version": version,
              "platform": platform,
              "target": "//src:bazel",
              "compilation_mode": "opt",
              "filename": binary.name,
              "size": binary.stat().st_size,
              "sha256": digest,
              "module_lock_sha256": hashlib.sha256(
                  Path("MODULE.bazel.lock").read_bytes()).hexdigest(),
          }
          (directory / "provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n")
          (directory / f"{binary.name}.sha256").write_text(
              f"{digest}  {binary.name}\n")
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Retain native binary and validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scanner-bazel-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/scanner-bazel/
            bazel-testlogs/src/test/java/com/google/devtools/build/lib/starlark/StarlarkMapActionTemplateTest/test.*
            bazel-testlogs/src/test/java/com/google/devtools/build/lib/starlark/StarlarkActionTest/test.*
            bazel-testlogs/src/test/java/com/google/devtools/build/lib/starlark/StarlarkActionWithShadowedActionTest/test.*
            bazel-testlogs/src/test/java/com/google/devtools/build/lib/buildtool/AqueryBuildToolTest/test.*
            bazel-testlogs/src/test/java/com/google/devtools/build/lib/sandbox/SmallTests/test.*
            bazel-testlogs/src/test/java/com/google/devtools/build/lib/remote/BuildWithoutTheBytesIntegrationTest/shard_*/test.*
            bazel-testlogs/src/test/java/com/google/devtools/build/lib/remote/RemoteTests/test.*
          if-no-files-found: error
          retention-days: 14
